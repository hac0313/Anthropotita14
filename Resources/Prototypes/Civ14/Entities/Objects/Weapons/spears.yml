- type: entity
  name: нагината
  parent: Spear
  id: civ13_spear_naginata
  description: >-
    Деревянный посох с лезвием на конце, которым можно пронзать тех, кто оскорбляет
    твоего господина.
  components:
    - type: Sprite
      sprite: Civ14/Weapons/naginata.rsi
    - type: MeleeWeapon
      range: 2.2
      attackRate: 0.8
      damage:
        types:
          Slash: 1
          Piercing: 13
      soundHit:
        path: /Audio/Weapons/bladeslice.ogg
    - type: IncreaseDamageOnWield
      damage:
        types:
          Piercing: 5
          Slash: 2
    - type: Item
      heldPrefix: null
      sprite: Civ14/Weapons/naginata.rsi
    - type: DisarmMalus
