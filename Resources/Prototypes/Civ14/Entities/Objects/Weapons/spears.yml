- type: entity
  name: копьё ассагай
  parent: Spear
  id: civ13_spear_assagai
  description: >-
    Деревянное копье с длинной рукоятью и тонко заточенным железным наконечником;
    известно как излюбленное оружие зулусских воинов.
  components:
    - type: Sprite
      sprite: Civ14/Weapons/assagai.rsi
    - type: MeleeWeapon
      range: 2
      attackRate: 0.8
      damage:
        types:
          Piercing: 19
      soundHit:
        path: /Audio/Weapons/bladeslice.ogg
    - type: Item
      heldPrefix: null
      sprite: Civ14/Weapons/assagai.rsi
    - type: DisarmMalus
    - type: Construction
      graph: civ13_spear_assagai
      node: end
