- type: entity
  abstract: true
  parent: BaseItem
  id: MortarAmmoBase
  name: base mortar shell
  components:
    - type: Sprite
      sprite: Civ14/Objects/Mortars/shells.rsi
      state: mortar_ammo_he
    - type: Item
      size: Huge
    - type: MortarShell

- type: entity
  parent: MortarAmmoBase
  id: MortarShellHE
  name: осколочно-фугасный минометный снаряд
  description: Минометный снаряд, начиненный бризантным взрывчатым веществом. Для активации бросьте его в минометную трубу.
  components:
    - type: Item
    - type: Sprite
      sprite: Civ14/Objects/Mortars/shells.rsi
      state: mortar_ammo_he
    - type: MortarShell
    - type: Explosive
      explosionType: CivDefault
      maxIntensity: 10 # these values need tuning to im sure
      intensitySlope: 3
      totalIntensity: 120
      canCreateVacuum: false
      deleteAfterExplosion: true
