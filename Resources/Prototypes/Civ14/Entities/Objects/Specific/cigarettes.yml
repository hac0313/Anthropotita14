- type: entity
  id: CigaretteUnfiltered
  parent: BaseCigar
  name: сигарета
  description: Сигарета без фильтра.
  components:
    - type: Sprite
      sprite: Civ14/Objects/Cigarettes/cigarette_unfiltered.rsi
      state: unlit-icon
    - type: Tag
      tags:
        - Cigarette
        - Trash
    - type: SpaceGarbage
    - type: Clothing
      sprite: Civ14/Objects/Cigarettes/cigarette_unfiltered.rsi
      slots: [mask]
      equippedPrefix: unlit
    - type: STWeight
      self: 0.05
    - type: Item
      size: Tiny
      sprite: Civ14/Objects/Cigarettes/cigarette_unfiltered.rsi
      heldPrefix: unlit
    - type: SolutionContainerManager
      solutions:
        smokable:
          maxVol: 40
          reagents:
            - ReagentId: Nicotine
              Quantity: 20
            - ReagentId: Epinephrine
              Quantity: 10

