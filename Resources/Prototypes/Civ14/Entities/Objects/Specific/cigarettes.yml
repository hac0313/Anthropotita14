- type: entity
  id: CigPackAtika
  parent: [BaseStorageItem, BaseBagOpenClose]
  name: Пачка сигарет "Атика"
  description: Пачка сигарет "Атика".
  components:
    - type: Sprite
      sprite: Civ14/Objects/Cigarettes/atika.rsi
      layers:
        - state: closed
          map: ["closeLayer"]
        - state: open
          map: ["openLayer"]
          visible: false
        - state: cig1
          map: ["cig1"]
          sprite: Civ14/Objects/Cigarettes/visualizer.rsi
          visible: false
        - state: cig2
          map: ["cig2"]
          sprite: Civ14/Objects/Cigarettes/visualizer.rsi
          visible: false
        - state: cig3
          map: ["cig3"]
          sprite: Civ14/Objects/Cigarettes/visualizer.rsi
          visible: false
        - state: cig4
          map: ["cig4"]
          sprite: Civ14/Objects/Cigarettes/visualizer.rsi
          visible: false
        - state: cig5
          map: ["cig5"]
          sprite: Civ14/Objects/Cigarettes/visualizer.rsi
          visible: false
        - state: cig6
          map: ["cig6"]
          sprite: Civ14/Objects/Cigarettes/visualizer.rsi
          visible: false
    - type: Tag
      tags:
        - CigPack
        - Trash
    - type: PhysicalComposition
      materialComposition:
        Steel: 50
    - type: SpaceGarbage
    - type: STWeight
      self: 0.15
    - type: Item
      sprite: Civ14/Objects/Cigarettes/atika.rsi
      size: Tiny
      shape: # Yes, this is cursed, but it breaks otherwise, dont question it.
        - 0,0,0,1
    - type: Storage
      grid:
        - 0,0,4,1
    - type: StorageFill
      contents:
        - id: CigaretteFiltered
          amount: 10
    - type: ItemCounter
      count:
        tags: [Cigarette]
      composite: true
      layerStates:
        - cig1
        - cig2
        - cig3
        - cig4
        - cig5
        - cig6
    - type: Appearance

- type: entity
  id: CigPackLuckyStrike
  parent: CigPackAtika
  name: Пачка сигарет "Лаки Страйк"
  description: Пачка сигарет "Лаки Страйк".
  components:
    - type: Sprite
      sprite: Civ14/Objects/Cigarettes/luckystrike.rsi
    - type: Item
