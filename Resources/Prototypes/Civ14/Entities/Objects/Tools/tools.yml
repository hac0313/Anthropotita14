- type: entity
  name: костяная лопата
  parent: Shovel
  id: BoneShovel
  description: Большой инструмент для копания и перемещения грунта.
  components:
    - type: Tag
      tags:
        - Shovel
    - type: Sprite
      sprite: Civ14/Objects/StoneAge/bone_shovel.rsi
      state: icon
    - type: STWeight
      self: 5
    - type: Item
      size: Large
    - type: Construction
      graph: BoneShovel
      node: boneshovel
      agemin: 0
      agemax: 8

- type: entity
  name: каменная лопата
  parent: Shovel
  id: StoneShovel
  description: Большой инструмент для копания и перемещения грунта.
  components:
