- type: entity
  parent: ClothingBackpack
  id: LeatherClothingBackpack
  name: кожаный рюкзак
  description: Прочный кожаный рюкзак.
  components:
    - type: Sprite
      sprite: Civ14/Objects/Storage/backpack.rsi
    - type: Construction
      graph: LeatherClothingBackpack
      node: end
      agemin: 0
      agemax: 8

- type: entity
  parent: ClothingBeltStorageBase
  id: LeatherClothingBelt
  name: кожаная сумка
  description: Кожаная сумка, которую носят на поясе.
  components:
    - type: Sprite
      sprite: Civ14/Objects/Storage/satchel.rsi
    - type: Construction
      graph: LeatherClothingBelt
      node: end
      agemin: 0
      agemax: 8

- type: entity
  parent: BaseItem
  id: LeatherWaterskin
  name: кожаный бурдюк для воды
  description: Кожаный бурдюк для воды, используемый для переноски жидкостей.
  components:
    - type: Sprite
      sprite: Civ14/Objects/Storage/storage.rsi
      state: waterskin
    - type: STWeight
      self: 2
    - type: Item
      size: Normal
    - type: SolutionContainerManager
      solutions:
        drink:
          maxVol: 100
    - type: SolutionTransfer
      canChangeTransferAmount: true
      maxTransferAmount: 5
    - type: Drink
    - type: MeleeWeapon
      soundNoDamage:
        path: "/Audio/Effects/Fluids/splat.ogg"
      damage:
        types:
          Blunt: 0
    - type: MixableSolution
      solution: drink
    - type: Spillable
      solution: drink
    - type: FitsInDispenser
      solution: drink
    - type: DrawableSolution
      solution: drink
    - type: RefillableSolution
      solution: drink
    - type: DrainableSolution
      solution: drink
    - type: UserInterface
      interfaces:
        enum.TransferAmountUiKey.Key:
          type: TransferAmountBoundUserInterface
    - type: Construction
      graph: LeatherWaterskin
      node: end
      agemin: 0
      agemax: 8
