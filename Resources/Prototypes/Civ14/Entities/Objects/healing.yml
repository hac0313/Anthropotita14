- type: entity
  name: целебные травы
  description: Пучок целебных трав, собранных с кустов. Помогает при ожогах и поверхностных ранах.
  parent: BaseHealingItem
  id: HealingHerbs
  suffix: Single
  components:
    - type: Tag
      tags:
        - Ointment
    - type: Sprite
      sprite: Civ14/Objects/surgery.rsi
      state: healing_herbs
    - type: Item
      heldPrefix: regenerative-mesh
    - type: Healing
      damageContainers:
        - Biological
      damage:
        types:
          Heat: -8
          Cold: -8
          Shock: -8
          Caustic: -8
        groups:
          Brute: -6
      healingBeginSound:
        path: "/Audio/Items/Medical/ointment_begin.ogg"
      healingEndSound:
        path: "/Audio/Items/Medical/ointment_end.ogg"
    - type: StaticPrice
      price: 20
    - type: Produce
      seedId: HealingHerbs
    - type: Stack
      stackType: StackHealingHerbs
      count: 1

